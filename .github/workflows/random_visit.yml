name: Random URL Visitor (1-3 Hours)

on:
  schedule:
    # 更改为每 1 小时（第 0 分钟）触发一次
    - cron: '0 * * * *'
  workflow_dispatch: # 保持手动触发功能不变

jobs:
  visit:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 执行不定时访问脚本
      run: python ping.py

name: Random URL Visitor

on:
  schedule:
    # 这里的 cron 表达式代表每 30 分钟启动一次（注：GitHub Actions 的定时可能存在几分钟到十几分钟的延迟，这本身也是一种随机）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击运行测试

jobs:
  visit:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 执行不定时访问脚本
      run: python ping.py
